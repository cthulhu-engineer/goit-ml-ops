{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "sensor-quality-inference.fullname" . }}
  labels:
    {{- include "sensor-quality-inference.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "sensor-quality-inference.selectorLabels" . | nindent 6 }}
  endpoints:
  - port: http
    path: {{ .Values.serviceMonitor.path }}
    interval: {{ .Values.serviceMonitor.interval }}
{{- end }}
