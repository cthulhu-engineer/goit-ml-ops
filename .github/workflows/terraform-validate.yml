name: Terraform Validation

on:
  push:
    branches:
      - main
      - lesson-7
    paths:
      - 'argocd/**'
      - 'argocd-local/**'
      - 'eks/**'
      - '.github/workflows/terraform-validate.yml'
  pull_request:
    branches:
      - main
      - lesson-7
    paths:
      - 'argocd/**'
      - 'argocd-local/**'
      - 'eks/**'

jobs:
  terraform-validate:
    name: Validate Terraform Configurations
    runs-on: ubuntu-latest

    strategy:
      matrix:
        directory:
          - argocd
          - argocd-local
          - eks

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Terraform Format Check
        id: fmt
        working-directory: ${{ matrix.directory }}
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        id: init
        working-directory: ${{ matrix.directory }}
        run: terraform init -backend=false

      - name: Terraform Validate
        id: validate
        working-directory: ${{ matrix.directory }}
        run: terraform validate -no-color

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `#### Terraform Validation Results for \`${{ matrix.directory }}\`

            #### Format Check 🖌 \`${{ steps.fmt.outcome }}\`
            #### Initialization ⚙️ \`${{ steps.init.outcome }}\`
            #### Validation 🤖 \`${{ steps.validate.outcome }}\`

            <details><summary>Show Validation Output</summary>

            \`\`\`
            ${{ steps.validate.outputs.stdout }}
            \`\`\`

            </details>

            *Pusher: @${{ github.actor }}, Working Directory: \`${{ matrix.directory }}\`, Workflow: \`${{ github.workflow }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });
