# GitHub Actions Workflow for MLOps Training Automation
# Automatically triggers Step Functions workflow on code changes

name: MLOps Training Pipeline

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'terraform/**'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod

env:
  AWS_REGION: us-east-1
  TF_VERSION: 1.6.0
  PYTHON_VERSION: '3.11'

jobs:
  # ============================================================================
  # BUILD LAMBDA PACKAGES
  # ============================================================================
  build-lambda:
    name: Build Lambda Packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build Lambda ZIP archives
        run: |
          echo "Building Lambda function packages..."
          cd terraform/lambda

          # Create validate.zip
          if [ -f validate.py ]; then
            zip -r validate.zip validate.py
            echo "✓ Created validate.zip"
          fi

          # Create log_metrics.zip
          if [ -f log_metrics.py ]; then
            zip -r log_metrics.zip log_metrics.py
            echo "✓ Created log_metrics.zip"
          fi

          ls -lh *.zip

      - name: Upload Lambda artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lambda-packages
          path: terraform/lambda/*.zip
          retention-days: 1

  # ============================================================================
  # TERRAFORM PLAN
  # ============================================================================
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: build-lambda
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Lambda artifacts
        uses: actions/download-artifact@v4
        with:
          name: lambda-packages
          path: terraform/lambda/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      - name: Terraform Validate
        working-directory: ./terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: ./terraform
        run: |
          terraform plan -out=tfplan
          terraform show -no-color tfplan > plan.txt

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: |
            terraform/tfplan
            terraform/plan.txt
          retention-days: 1

      - name: Comment PR with Plan
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('terraform/plan.txt', 'utf8');
            const output = `#### Terraform Plan
            <details><summary>Show Plan</summary>

            \`\`\`terraform
            ${plan}
            \`\`\`

            </details>`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

  # ============================================================================
  # TERRAFORM APPLY
  # ============================================================================
  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: terraform-plan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://console.aws.amazon.com/states/home

    outputs:
      state_machine_arn: ${{ steps.tf-output.outputs.state_machine_arn }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Lambda artifacts
        uses: actions/download-artifact@v4
        with:
          name: lambda-packages
          path: terraform/lambda/

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: terraform/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      - name: Terraform Apply
        working-directory: ./terraform
        run: terraform apply -auto-approve tfplan

      - name: Get Terraform Outputs
        id: tf-output
        working-directory: ./terraform
        run: |
          STATE_MACHINE_ARN=$(terraform output -raw state_machine_arn)
          echo "state_machine_arn=${STATE_MACHINE_ARN}" >> $GITHUB_OUTPUT
          echo "State Machine ARN: ${STATE_MACHINE_ARN}"

      - name: Create deployment summary
        run: |
          echo "### Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **State Machine ARN:** \`${{ steps.tf-output.outputs.state_machine_arn }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Region:** ${{ env.AWS_REGION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # TRIGGER TRAINING PIPELINE
  # ============================================================================
  train-model:
    name: Trigger Training Pipeline
    runs-on: ubuntu-latest
    needs: terraform-apply
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Prepare execution input
        id: prepare-input
        run: |
          INPUT_JSON=$(cat <<EOF
          {
            "source": "github-actions",
            "commit": "${{ github.sha }}",
            "commit_short": "${GITHUB_SHA:0:7}",
            "branch": "${{ github.ref_name }}",
            "workflow_run_id": "${{ github.run_id }}",
            "workflow_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "triggered_by": "${{ github.actor }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "repository": "${{ github.repository }}"
          }
          EOF
          )
          echo "input_json<<EOF" >> $GITHUB_OUTPUT
          echo "$INPUT_JSON" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "### Input JSON" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          echo "$INPUT_JSON" | jq '.' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Start Step Functions execution
        id: start-execution
        env:
          STATE_MACHINE_ARN: ${{ needs.terraform-apply.outputs.state_machine_arn }}
        run: |
          echo "=============================================="
          echo "  MLOps Training Pipeline Execution"
          echo "=============================================="
          echo "Commit SHA: ${GITHUB_SHA:0:7}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Author: ${{ github.actor }}"
          echo "Workflow Run: ${{ github.run_id }}"
          echo "=============================================="

          if [ -z "${STATE_MACHINE_ARN}" ]; then
            echo "ERROR: STATE_MACHINE_ARN is not set!"
            echo "Please ensure terraform-apply job completed successfully."
            exit 1
          fi

          EXECUTION_NAME="mlops-train-${GITHUB_SHA:0:7}-$(date +%s)"
          echo "Starting execution: ${EXECUTION_NAME}"

          EXECUTION_ARN=$(aws stepfunctions start-execution \
            --state-machine-arn "${STATE_MACHINE_ARN}" \
            --name "${EXECUTION_NAME}" \
            --input '${{ steps.prepare-input.outputs.input_json }}' \
            --region "${AWS_REGION}" \
            --query 'executionArn' \
            --output text)

          echo "execution_arn=${EXECUTION_ARN}" >> $GITHUB_OUTPUT
          echo "execution_name=${EXECUTION_NAME}" >> $GITHUB_OUTPUT
          echo ""
          echo "✓ Execution started successfully!"
          echo "Execution ARN: ${EXECUTION_ARN}"

      - name: Monitor execution
        id: monitor
        env:
          EXECUTION_ARN: ${{ steps.start-execution.outputs.execution_arn }}
        run: |
          echo "Monitoring execution status..."
          STATUS="RUNNING"
          TIMEOUT=300
          ELAPSED=0

          while [ "${STATUS}" = "RUNNING" ] && [ ${ELAPSED} -lt ${TIMEOUT} ]; do
            sleep 10
            ELAPSED=$((ELAPSED + 10))

            STATUS=$(aws stepfunctions describe-execution \
              --execution-arn "${EXECUTION_ARN}" \
              --region "${AWS_REGION}" \
              --query 'status' \
              --output text)

            echo "Status: ${STATUS} (${ELAPSED}s elapsed)"
          done

          echo "status=${STATUS}" >> $GITHUB_OUTPUT
          echo "=============================================="
          echo "Final Status: ${STATUS}"
          echo "=============================================="

      - name: Get execution results
        if: always()
        env:
          EXECUTION_ARN: ${{ steps.start-execution.outputs.execution_arn }}
        run: |
          RESULT=$(aws stepfunctions describe-execution \
            --execution-arn "${EXECUTION_ARN}" \
            --region "${AWS_REGION}")

          echo "### Execution Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ steps.monitor.outputs.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Execution Name:** ${{ steps.start-execution.outputs.execution_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Execution ARN:** \`${EXECUTION_ARN}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "<details><summary>Full Execution Details</summary>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          echo "$RESULT" | jq '.' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY

      - name: Check execution status
        if: steps.monitor.outputs.status == 'SUCCEEDED'
        run: |
          echo "✓ Training pipeline completed successfully!"
          exit 0

      - name: Handle failure
        if: steps.monitor.outputs.status == 'FAILED' || steps.monitor.outputs.status == 'TIMED_OUT' || steps.monitor.outputs.status == 'ABORTED'
        run: |
          echo "✗ Pipeline execution failed with status: ${{ steps.monitor.outputs.status }}"
          exit 1

      - name: Handle timeout
        if: steps.monitor.outputs.status == 'RUNNING'
        run: |
          echo "⚠ Pipeline is still running after timeout"
          echo "Check AWS Console for final status"
          exit 0

  # ============================================================================
  # MANUAL TRIGGER (for testing)
  # ============================================================================
  manual-trigger:
    name: Manual Training Trigger
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Start execution
        env:
          STATE_MACHINE_ARN: ${{ secrets.STATE_MACHINE_ARN }}
        run: |
          echo "Manual training pipeline execution"

          if [ -z "${STATE_MACHINE_ARN}" ]; then
            echo "ERROR: STATE_MACHINE_ARN secret is not set!"
            exit 1
          fi

          INPUT_JSON='{"source":"github-actions-manual","commit":"'"${GITHUB_SHA:0:7}"'","branch":"'"${{ github.ref_name }}"'","environment":"'"${{ github.event.inputs.environment }}"'"}'

          aws stepfunctions start-execution \
            --state-machine-arn "${STATE_MACHINE_ARN}" \
            --name "manual-train-$(date +%s)" \
            --input "${INPUT_JSON}" \
            --region "${AWS_REGION}"

          echo "✓ Manual execution triggered for environment: ${{ github.event.inputs.environment }}"
